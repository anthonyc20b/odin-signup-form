<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odin Sign-up Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="signup-body">
        <div class="sidebar">
            <div class="logo">
                <img src="./images/odin-lined.png" alt="odin project lined logo">
                <p>ODIN</p>
            </div>
            <a href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA" id="caption">Photo by Halie West on Unsplash</a>
        </div>

        <div class="main-content">
            <div class="header">
                <h2>This is not a real service! You know you need something
                    like this in your life to help you realize your deepest dreams. 
                    Sign up <em>now</em> to get started.
                </h2>
                <h2>You <em>know</em> you want to.</h2>
            </div>

            <div class="form-content">
                <h2>Let's do this!</h2>
                <form action="" method="post" id="signup-form">
                    <label for="firstname">First Name</label>
                    <input type="text" name="user_firstname" id="firstname" required>

                    <label for="lastname">Last Name</label>
                    <input type="text" name="user_lastname" id="lastname" required>

                    <label for="email">Email</label>
                    <input type="email" name="user_email" id="email" required placeholder="you@example.com">

                    <label for="phone">Phone Number</label>
                    <input type="tel" name="user_phone_number" id="phone" required pattern="[0-9]{10}">

                    <label for="password">Password</label>
                    <input type="password" name="user_password" id="password" required>

                    <label for="password-confirm">Confirm Password</label>
                    <input type="password" name="user_password_confirm" id="password-confirm" required>
                </form>
            </div>
            <div class="submission">
                <button type="submit" form="signup-form">Create Account</button>
                <p>Already have an account? <a href="">Log In</a></p>
            </div>
        </div>
    </div>
</body>
</html>
